<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كيبلر للتجارة العامة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0e16;--card:#121926;--ink:#e8eef7;--mute:#8a9ab0;--line:#1f2b3d;--lona:#4f8cff;--fayf:#2fd392;--err:#ff6b6b}
*{box-sizing:border-box;margin:0}
html{scroll-padding-bottom:120px}
body{font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;background:radial-gradient(900px 420px at 50% -80px,#16233a,transparent),var(--bg);background-repeat:no-repeat;color:var(--ink);line-height:1.6;padding-bottom:120px;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:30px 0 10px}
.hd{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:50%;background:#1c1c1e;flex:none;overflow:hidden;box-shadow:0 0 0 2px #e8eef7,0 0 0 5px rgba(79,140,255,.28),0 8px 30px rgba(79,140,255,.3)}
.logo span{font:700 30px inherit;color:#0a0e16}
.logo img{width:100%;height:100%;object-fit:contain}
header h1{font-size:26px;font-weight:700;letter-spacing:0}
header p{color:var(--mute);font-size:15px}
h2{font-size:17px;margin:28px 0 12px;color:var(--mute);font-weight:500}
.prod{position:relative;overflow:hidden;background:var(--card);border-radius:18px;border:1px solid var(--line);padding:18px;margin-bottom:14px;transition:border-color .25s,box-shadow .25s;--mx:50%;--my:0}
.prod.l{--c:var(--lona)}.prod.f{--c:var(--fayf)}
.prod::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(220px circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);opacity:.7}
.prod.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 10px 34px color-mix(in srgb,var(--c) 22%,transparent)}
.prod>*{position:relative}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top h3{font-size:22px}
.spec{color:var(--mute);font-size:14px}
.price{text-align:left;white-space:nowrap}
.price b{font-size:22px;color:var(--c)}
.price small{display:block;color:var(--mute);font-size:12px}
.pic{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:center 58%;border-radius:12px;margin-bottom:14px;cursor:zoom-in;background:#fff}
#lb{position:fixed;inset:0;background:rgba(4,7,12,.92);display:none;place-items:center;z-index:50;padding:16px;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:100%;border-radius:12px}
.stack{display:flex;flex-wrap:wrap;gap:5px;min-height:28px;margin:14px 0}
.stack i{width:30px;height:20px;border-radius:5px;background:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 70%,transparent);animation:pop .2s ease-out}
.stack em{font-style:normal;color:var(--mute);font-size:13px;align-self:center}
@keyframes pop{from{transform:translateY(-8px) scale(.4);opacity:0}}
.row{display:flex;align-items:center;justify-content:space-between}
.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#0e1522;font:700 22px inherit;color:var(--ink);cursor:pointer;transition:transform .1s,background .15s}
.step button:active{transform:scale(.9);background:var(--c);color:#06101c}
.step input{width:66px;height:46px;text-align:center;font:700 19px inherit;border:1px solid var(--line);border-radius:12px;background:#0e1522;color:var(--ink)}
.line{color:var(--mute);font-size:14px}
.line b{color:var(--ink)}
label{display:block;font-size:14px;color:var(--mute);margin:14px 0 5px}
.f input,.f textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:16px inherit;background:#0e1522;color:var(--ink);transition:border-color .2s}
.f textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--lona);box-shadow:0 0 0 3px rgba(79,140,255,.25)}
button:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:2px}
.bar{position:fixed;inset:auto 0 0 0;background:rgba(10,14,22,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:0}
.sum{flex:1;font-size:13px;color:var(--mute)}
.sum b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.send{height:54px;padding:0 28px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--lona),var(--fayf));color:#04101c;font:700 17px inherit;cursor:pointer;box-shadow:0 8px 26px rgba(47,211,146,.3);transition:transform .1s,opacity .2s}
.send:active{transform:scale(.96)}
.send:disabled{opacity:.35;box-shadow:none}
.done{display:none;background:var(--card);border:1px solid var(--fayf);border-radius:18px;padding:22px;text-align:center;margin:10px 0;box-shadow:0 0 40px rgba(47,211,146,.18)}
.done h2{color:var(--fayf);margin:0 0 6px;font-size:22px}
.toast{color:var(--err);text-align:center;font-size:14px;min-height:20px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap hd">
<div class="logo" id="logo"><span>K</span></div>
<div><h1>كيبلر للتجارة العامة</h1><p>جملة للمحلات والمطاعم بكربلاء</p></div>
</div></header>

<main class="wrap">
<div class="done" id="done"><h2>وصل طلبك</h2><p id="doneTxt"></p><p class="spec">راح نتصل بيك لتأكيد الطلب. الدفع عند الاستلام.</p></div>

<h2>اختار الكمية</h2>
<div id="list"></div>

<h2>بيانات الطلب</h2>
<div class="f" id="form">
<label for="shop">اسم المحل / المطعم</label><input id="shop" autocomplete="organization">
<div class="err" id="e_shop"></div>
<label for="phone">رقم الهاتف</label><input id="phone" type="tel" inputmode="numeric" placeholder="07xxxxxxxxx" autocomplete="tel">
<div class="err" id="e_phone"></div>
<label for="addr">العنوان (المنطقة وأقرب نقطة دالة)</label><textarea id="addr"></textarea>
<div class="err" id="e_addr"></div>
<label for="rep">اسم المندوب (إذا موجود)</label><input id="rep">
<label for="note">ملاحظات</label><input id="note">
</div>
<div class="toast" id="toast" role="alert"></div>
<div id="lb"><img alt=""></div>
</main>

<div class="bar"><div class="wrap">
<div class="sum">المجموع<b id="total">0 د.ع</b></div>
<button class="send" id="send" disabled>أرسل الطلب</button>
</div></div>

const TG = {token:BOT_TOKEN, chat:CHAT_ID};
const tgReady = (async()=>{ if(!CONFIG_URL) return;
  try{ const j=await (await fetch(CONFIG_URL)).json();
    TG.token=j.token||j.botToken||j.bot_token||TG.token;
    TG.chat=j.chat_id||j.chatId||j.chat||TG.chat; }catch(e){} })();
const qty = {lona:0, fayf:0};
let shownTotal=0, raf;
function animateTotal(to){
  cancelAnimationFrame(raf); const from=shownTotal, t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/320);
    shownTotal=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    document.getElementById('total').textContent=shownTotal.toLocaleString('en-US')+' د.ع';
    if(k<1) raf=requestAnimationFrame(step);})(t0);
}
function spot(e){const c=e.target.closest('.prod'); if(!c) return; const r=c.getBoundingClientRect();
  c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px');}
const fmt = n => n.toLocaleString('en-US');
const $ = id => document.getElementById(id);

function render(){
  $('list').innerHTML = PRODUCTS.map(p => `
  <div class="prod ${p.cls}" id="c_${p.id}">
    <img class="pic" src="${IMGS[p.id]}" alt="${p.name}" data-full="${p.id}">
    <div class="top">
      <div><h3>${p.name}</h3><div class="spec">${p.unit} ${p.box} علبة · 600 سحبة للعلبة</div></div>
      <div class="price"><b>${fmt(p.price)}</b><small>للـ${p.unit} · ${fmt(Math.round(p.price/p.box))} للعلبة</small></div>
    </div>
    <div class="stack" id="s_${p.id}"></div>
    <div class="row">
      <div class="step">
        <button type="button" data-id="${p.id}" data-d="-1" aria-label="نقص">−</button>
        <input id="q_${p.id}" inputmode="numeric" value="0" aria-label="كمية ${p.name}">
        <button type="button" data-id="${p.id}" data-d="1" aria-label="زيادة">+</button>
      </div>
      <div class="line">المبلغ <b id="l_${p.id}">0</b></div>
    </div>
  </div>`).join('');
}
function update(){
  let total=0, count=0;
  PRODUCTS.forEach(p=>{
    const n=qty[p.id], sub=n*p.price; total+=sub; count+=n;
    $('q_'+p.id).value=n; $('l_'+p.id).textContent=fmt(sub); $('c_'+p.id).classList.toggle('on',n>0);
    const shown=Math.min(n,14);
    $('s_'+p.id).innerHTML='<i></i>'.repeat(shown)+(n>14?`<em>+${n-14}</em>`:'');
  });
  animateTotal(total);
  $('send').disabled=count===0;
  return total;
}
$('list').addEventListener('click',e=>{const i=e.target.closest('.pic'); if(!i) return;
  $('lb').querySelector('img').src=i.src; $('lb').classList.add('on');});
$('lb').addEventListener('click',()=>$('lb').classList.remove('on'));
$('list').addEventListener('pointermove',spot); $('list').addEventListener('pointerdown',spot);
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(navigator.vibrate) navigator.vibrate(8);
  const id=b.dataset.id; qty[id]=Math.max(0,Math.min(999,qty[id]+Number(b.dataset.d))); update();
});
$('list').addEventListener('input',e=>{
  if(e.target.tagName!=='INPUT') return;
  const id=e.target.id.slice(2); qty[id]=Math.max(0,Math.min(999,parseInt(e.target.value.replace(/\D/g,''))||0));
  const t=PRODUCTS.find(p=>p.id===id); update();
});

function check(){
  const v={shop:$('shop').value.trim(),phone:$('phone').value.replace(/\s/g,''),addr:$('addr').value.trim()};
  const e={
    shop:v.shop?'':'اكتب اسم المحل',
    phone:/^07\d{9}$/.test(v.phone)?'':'الرقم لازم 11 خانة ويبدأ بـ07',
    addr:v.addr.length>=5?'':'اكتب المنطقة وأقرب نقطة دالة'
  };
  Object.keys(e).forEach(k=>$('e_'+k).textContent=e[k]);
  return Object.values(e).every(x=>!x)?v:null;
}

$('send').addEventListener('click',async()=>{
  $('toast').textContent='';
  const v=check(); if(!v){ $('form').scrollIntoView({behavior:'smooth'}); return; }
  const total=update();
  const no=Date.now().toString().slice(-6);
  const lines=PRODUCTS.filter(p=>qty[p.id]).map(p=>`• ${p.name}: ${qty[p.id]} ${p.unit} × ${fmt(p.price)} = ${fmt(qty[p.id]*p.price)}`);
  const text=[`طلب جديد #${no} — كيبلر للتجارة العامة`,'',...lines,'',`المجموع: ${fmt(total)} د.ع`,'',
    `المحل: ${v.shop}`,`الهاتف: ${v.phone}`,`العنوان: ${v.addr}`,
    `المندوب: ${$('rep').value.trim()||'—'}`,`ملاحظات: ${$('note').value.trim()||'—'}`].join('\n');
  const btn=$('send'); btn.disabled=true; btn.textContent='جاري الإرسال…';
  try{
    await tgReady;
    const r=await fetch(`https://api.telegram.org/bot${TG.token}/sendMessage`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:TG.chat,text})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.description||'فشل الإرسال');
    $('doneTxt').textContent=`رقم الطلب #${no} · المجموع ${fmt(total)} د.ع`;
    $('done').style.display='block'; $('done').scrollIntoView({behavior:'smooth'});
    qty.lona=qty.fayf=0; ['shop','phone','addr','note'].forEach(k=>$(k).value=''); update();
  }catch(err){
    $('toast').textContent='ما انرسل الطلب. تأكد من الإنترنت وجرب مرة ثانية.';
  }
  btn.textContent='أرسل الطلب'; btn.disabled=Object.values(qty).every(n=>!n);
});

render(); update();
</script>
</body>
</html>
